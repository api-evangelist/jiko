- aid: jiko:jiko-partner-api
  name: Jiko Partner API
  humanURL: https://docs.jiko.io/products/partner-api
  baseURL: https://api.sandbox-api.jikoservices.com/api/v1
  description: The Partner API is for applications that embed Jiko's services and offer
    Jiko products to their own customers. It authenticates with a bearer token obtained
    via Login, and requires an x-jiko-idempotency header plus an HMAC-SHA256 x-jiko-signature
    request signature and IP allowlisting. It covers partner-tenant onboarding (KYC/KYB),
    customers, pockets, portals, cards (physical and virtual), ACH originations, wires,
    JikoNet transfers, and event subscriptions/webhooks.
  tags:
