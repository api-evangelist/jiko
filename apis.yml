name: Jiko
description: Jiko is a fintech infrastructure company that turns idle cash into US
  Treasury bills held in the customer's own name, combining a nationally chartered
  bank, a registered broker-dealer, and a real-time settlement network (JikoNet) behind
  a single API. Its "Jiko as a Service" platform lets partners embed T-bill-backed
  accounts, virtual and physical debit cards, pockets (paired bank + brokerage accounts),
  and multi-rail money movement (ACH, wire, SWIFT, cards, and 24/7 on-us JikoNet transfers)
  into their own applications. Jiko exposes two OAuth 2.0 / HMAC-secured REST APIs
  — a Customer API for direct integrators and a Partner API for embedding Jiko products
  on behalf of end customers.
