apis:
- aid: jiko:jiko-customer-api
  name: Jiko Customer API
  humanURL: https://docs.jiko.io/products/customer-api
  baseURL: https://api.sandbox-api.jikoservices.com/api/v1
  description: The Customer API is for Jiko customers integrating Jiko directly into
    their own internal systems. It uses OAuth 2.0 (authorization code and client credentials
    flows) with Private Key JWT client authentication, PKCE (required) and DPoP (optional),
    and covers pockets, portals, transfers (JikoNet, wires, SWIFT, ACH), counterparties,
    trades and trading strategies, transactions, reports, teams, subscriptions/webhooks,
    and customer management.
  tags:
